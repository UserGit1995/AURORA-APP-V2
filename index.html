<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURORA - Distribuzione Prodotti Igiene e Pulizia</title>
    <meta name="description" content="Piattaforma B2B per la distribuzione di prodotti per l'igiene, pulizia e benessere per la casa e la persona." />
    <link rel="icon" type="image/png" href="/logo-login.png" />
    <meta name="theme-color" content="#0d1420" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aurora" />
    <script src="/install-banner.js" defer></script>
    <!-- Caratteri caricati dall'app stessa (nessuna richiesta a Google) -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="preload" href="/nuova/emblem.svg" as="image">
    <!-- Schermata di avvio con il logo azzurro (come nel prototipo) -->
    <style>
      #n-intro{position:fixed;inset:0;z-index:2147483000;background:#07111f;display:grid;place-items:center;transition:opacity .5s .1s,visibility .6s}
      #n-intro img{width:110px;animation:n-intro-rise 1s cubic-bezier(.22,1,.36,1) both}
      #n-intro.done{opacity:0;visibility:hidden;pointer-events:none}
      @keyframes n-intro-rise{from{transform:translateY(16px) scale(.9);opacity:0;filter:blur(6px)}}
    </style>
  </head>
  <body class="bg-[#040813] text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
    <div id="n-intro" aria-hidden="true"><img src="/nuova/emblem.svg" alt=""></div>
    <script>
      (function () {
        var el = document.getElementById('n-intro');
        var hide = function () {
          if (!el || el.classList.contains('done')) return;
          el.classList.add('done');
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 700);
        };
        window.addEventListener('load', function () { setTimeout(hide, 650); });
        setTimeout(hide, 4000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
